version: "3.1"

services:
  registry:
    build: .
    volumes:
      - ./index.js:/app/index.js
      - ./api-doc.yml:/app/api-doc.yml
      - ./lib:/app/lib
      - ./prisma:/app/prisma
      - ./test:/app/test
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/thing_registry
    restart: always
    ports:
      - 8080:8080
      - 9229:9229
    depends_on: 
      - db

  db:
    image: postgres:14
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thing_registry
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: